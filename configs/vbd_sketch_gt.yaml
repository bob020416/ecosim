backend: vbd
mode: sketch
control_type: gt

paths:
  test_path: data/vbd/validation_pkl
  model_path: checkpoints/vbd/base.ckpt
  ctrl_ckpt_path: checkpoints/vbd/sketch_control.ckpt
  output_dir: outputs/vbd_sketch_gt

runtime:
  device: cuda
  seed: 42
  use_training_format: true
  closedloop: true
  only_controlnet: true
  max_scenarios: 10
  horizon_steps: 11
  total_steps: 80
  num_candidates: 8
  batch_size: 2
  num_samples: 32
  save_simulation: false
  plot_control_samples: false
