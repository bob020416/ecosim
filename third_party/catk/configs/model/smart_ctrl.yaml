_target_: src.smart.model.smart_ctrl.SMART
model_config:
  lr: 0.0005
  lr_warmup_steps: 0
  lr_total_steps: ${trainer.max_epochs}
  lr_min_ratio: 0.05
  n_rollout_closed_val: 32
  n_batch_wosac_metric: 10
  n_vis_batch: 2
  n_vis_scenario: 5
  n_vis_rollout: 5
  val_open_loop: true
  val_closed_loop: true
  map_boundary:
    enable: false
    margin: 3.0
  token_processor:
    map_token_file: "map_traj_token5.pkl"
    agent_token_file: "agent_vocab_555_s2.pkl"
    map_token_sampling: # open-loop
      num_k: 1 # for k nearest neighbors
      temp: 1.0 # uniform sampling
    agent_token_sampling: # closed-loop
      num_k: 1 # for k nearest neighbors
      temp: 1.0
  validation_rollout_sampling:
    criterium: topk_prob
    num_k: 5 # for k most likely
    temp: 1.0
  training_rollout_sampling:
    criterium: topk_prob # {topk_dist_sampled_with_prob, topk_prob, topk_prob_sampled_with_dist}
    num_k: -1 # for k nearest neighbors, set to -1 to turn-off closed-loop training
    temp: 1.0
  decoder:
    hidden_dim: 128
    num_freq_bands: 64
    num_heads: 8
    head_dim: 16
    dropout: 0.1
    hist_drop_prob: 0.1
    num_map_layers: 3
    num_agent_layers: 6
    pl2pl_radius: 10
    pl2a_radius: 30
    a2a_radius: 60
    time_span: 30
    num_historical_steps: 11
    num_future_steps: 80
  control:
    use_control: true
    conditioning_mode: sketch # sketch or latent
    text_model_path: distilbert-base-uncased
    text_max_length: 384
    text_freeze_backbone: true
    text_use_mean_pool: false
    text_lora_rank: 16
    text_lora_alpha: 0.4
    text_lora_dropout: 0.05
    text_lora_layers: 6
    text_lora_target_modules: [q_lin, k_lin, v_lin, out_lin]
    debug_lora_grads: false
    future_len: 16
    feature_dim: 256
    encoder_layers: 2
    encoder_heads: 4
    encoder_d_ff: 256
    encoder_dropout: 0.0
    per_step: true
    remaining_window: true
    sketch_mode: dynamic # dynamic: remaining window; static: full sketch at every step
    condition_time_embed: false
    window_len: 0
    use_cross_agent_attn: false
    fusion_strategy: film # film or additive
    film_blocks: [0, 1, 2, 3, 4, 5]
    film_hidden_dim: 256
    film_dropout: 0.0
    film_init_mode: identity # identity or random
    film_identity_noise_std: 0.001
    dropout: 0.3
    no_control_prob: 0.0
    mask_from_train: true
    zero_invalid: true
    freeze_base: true
    latent_agent_dim: 512
    latent_scene_dim: 0
    latent_hidden_dim: 256
    latent_n_layers: 3
    latent_dropout: 0.0
    latent_cross_agent_heads: 4
  base_lora:
    enable: false
    rank: 0
    alpha: 16.0
    dropout: 0.0
    target_modules: [to_q, to_k, to_v, to_out]
    freeze_base: true
    unfreeze_control: true
  wosac_submission:
    is_active: false
    method_name: "SMART-CTRL"
    authors: [Anonymous]
    affiliation: YOUR_AFFILIATION
    description: YOUR_DESCRIPTION
    method_link: YOUR_METHOD_LINK
    account_name: YOUR_ACCOUNT_NAME
  training_loss:
    use_gt_raw: true
    gt_thresh_scale_length: -1.0  # {"veh": 4.8, "cyc": 2.0, "ped": 1.0}
    label_smoothing: 0.1
    rollout_as_gt: false
  finetune: false
